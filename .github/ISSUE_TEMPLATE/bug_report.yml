name: Báo lỗi
description: Báo cáo lỗi để giúp chúng tôi cải thiện
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã dành thời gian báo cáo lỗi! Vui lòng điền đầy đủ thông tin bên dưới.

        Đây là nơi báo lỗi của Ngó Sen.

  - type: textarea
    id: description
    attributes:
      label: Mô tả lỗi
      description: Mô tả rõ ràng về lỗi bạn gặp phải
      placeholder: Khi tôi gõ..., bộ gõ hiển thị...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Các bước tái hiện
      description: Các bước để tái hiện lỗi
      placeholder: |
        1. Mở...
        2. Gõ...
        3. Nhấn...
        4. Lỗi xuất hiện
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
      description: Mô tả kết quả bạn mong đợi
      placeholder: Khi gõ..., bộ gõ nên hiển thị...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế
      description: Mô tả kết quả thực tế xảy ra
      placeholder: Thay vào đó, bộ gõ hiển thị...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Phiên bản Ngó Sen
      description: Số phiên bản của gói `fcitx5-ngosen` đã cài. Bản tự build thì ghi mã commit.
      placeholder: 'ví dụ: 1.2.2-1'
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Cách cài đặt
      description: Bạn đã cài đặt Ngó Sen bằng cách nào?
      options:
        - Lệnh cài một dòng (install.sh)
        - Gói tải từ trang Releases
        - Tự build từ source
        - Khác
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Hệ điều hành / Distro
      description: Bạn đang sử dụng hệ điều hành nào?
      placeholder: 'ví dụ: Arch Linux, Ubuntu 24.04, Fedora 40...'
    validations:
      required: true

  - type: dropdown
    id: desktop_env
    attributes:
      label: Môi trường Desktop
      description: Bạn đang sử dụng môi trường desktop nào?
      options:
        - KDE Plasma
        - GNOME
        - XFCE
        - Sway
        - Hyprland
        - i3
        - Khác (ghi cụ thể ở dưới)
    validations:
      required: false

  - type: input
    id: input_type
    attributes:
      label: Kiểu gõ
      description: Bạn đang sử dụng kiểu gõ nào?
      placeholder: Ví dụ Telex, VNI, VIQR, .....
    validations:
      required: true

  - type: textarea
    id: diagnose
    attributes:
      label: Diagnose
      description: |
        Nếu có lỗi, vui lòng cung cấp diagnose từ fcitx5.
        Bạn có thể lấy diagnose bằng lệnh: `fcitx5-diagnose`.
      render: shell

  - type: textarea
    id: log_fcitx5
    attributes:
      label: Log của fcitx5
      description: |
        Log của fcitx5 (Chạy lệnh `fcitx5 --verbose ngosen=4` ở terminal trong quá trình tái hiện lỗi)
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Thông tin bổ sung
      description: Bất kỳ thông tin nào khác có thể hữu ích
      placeholder: Ảnh chụp màn hình, cấu hình, v.v.
