name: Package repositories

# Built on publish, not on tag push, so users get a release only after its draft was checked.
# The repositories share the one Pages site, and every deploy replaces it, so they ship together.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Ngó Sen for GNOME ships from the same repositories, so one source line and one key cover both.
  # Run this workflow by hand from the newest ngosen-* tag after an ibus-ngosen release; see
  # RELEASING.md there.
  IBUS_REPOSITORY: ngosen/ibus-ngosen

# bash runs with pipefail, so a failed release listing stops the job instead of leaving a package out.
defaults:
  run:
    shell: bash

concurrency:
  group: package-repositories
  cancel-in-progress: false

jobs:
  apt:
    name: APT repository
    if: startsWith(github.ref, 'refs/tags/ngosen-') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get -qq update && sudo apt-get -qq install -y apt-utils

      # The two newest releases of each edition, so users can go back one version with apt.
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repo in "$GITHUB_REPOSITORY" "$IBUS_REPOSITORY"; do
              packaging/download-release-files.sh "$repo" 2 '*.deb' debs
          done

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: packaging/import-signing-key.sh

      - name: Build repository
        run: packaging/build-apt-repo.sh debs apt

      # install.sh adds the repository only with the key it pins; another key would leave new
      # installs without updates.
      - name: Check the key install.sh pins
        run: test "$(sha256sum apt/ngosen.gpg | cut -d' ' -f1)" = "$(sed -n 's/^REPO_KEY_SHA256=//p' install.sh)"

      - uses: actions/upload-artifact@v7
        with:
          name: repo-apt
          path: apt

  pacman:
    name: pacman repository
    if: startsWith(github.ref, 'refs/tags/ngosen-') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    container: archlinux:latest
    environment: release

    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed github-cli gnupg

      - uses: actions/checkout@v7

      # The newest release of each edition; ibus-ngosen may have none yet.
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repo in "$GITHUB_REPOSITORY" "$IBUS_REPOSITORY"; do
              packaging/download-release-files.sh "$repo" 1 '*.pkg.tar.zst' pkgs
          done

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: packaging/import-signing-key.sh

      - name: Build repository
        run: packaging/build-arch-repo.sh pkgs arch

      - uses: actions/upload-artifact@v7
        with:
          name: repo-arch
          path: arch

  zypper:
    name: openSUSE repository
    if: startsWith(github.ref, 'refs/tags/ngosen-') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get -qq update && sudo apt-get -qq install -y createrepo-c

      # The two newest releases of each edition, so users can go back one version with zypper.
      # Older ibus-ngosen releases have no openSUSE package.
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repo in "$GITHUB_REPOSITORY" "$IBUS_REPOSITORY"; do
              packaging/download-release-files.sh "$repo" 2 '*.opensuse-tumbleweed.x86_64.rpm' rpms
          done

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: packaging/import-signing-key.sh

      - name: Build repository
        run: packaging/build-zypper-repo.sh rpms opensuse

      - uses: actions/upload-artifact@v7
        with:
          name: repo-opensuse
          path: opensuse

  deploy:
    name: Publish to GitHub Pages
    needs: [apt, pacman, zypper]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: repo-apt
          path: site/apt

      - uses: actions/download-artifact@v8
        with:
          name: repo-arch
          path: site/arch

      - uses: actions/download-artifact@v8
        with:
          name: repo-opensuse
          path: site/opensuse

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
