name: APT repository

# Built on publish, not on tag push, so apt users get a release only after its draft was checked.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign
    if: startsWith(github.ref, 'refs/tags/ngosen-') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get -qq update && sudo apt-get -qq install -y apt-utils

      # The two newest releases, so users can go back one version with apt.
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir debs
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
              --limit 2 --json tagName --jq '.[].tagName' |
              while read -r tag; do
                  gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs
              done

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
              echo "::error::APT_SIGNING_KEY is not set in the release environment"
              exit 1
          fi
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

      - name: Build repository
        run: packaging/build-apt-repo.sh debs site/apt

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}apt/

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
