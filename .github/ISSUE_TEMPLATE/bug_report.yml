name: Báo lỗi
description: Báo lỗi khi dùng Ngó Sen.
labels: ['lỗi']
body:
  - type: markdown
    attributes:
      value: |
        Cách nhanh nhất: mở "Cài đặt Ngó Sen" → "Giới thiệu" → "Kiểm tra máy tôi…" để kiểm tra thiết lập.
        Chọn "Báo cáo lỗi…" để mở form này với kết quả, version và distro đã điền sẵn, hoặc "Chép kết quả" để tự dán vào ô bên dưới.
        Kết quả có tên các app; hãy đọc trước khi gửi.

  - type: textarea
    id: description
    attributes:
      label: Bạn gặp lỗi gì?
      description: Ghi đúng các phím đã gõ, kết quả thực tế và kết quả mong đợi. Nếu lỗi không liên quan đến gõ chữ, ghi cách làm xuất hiện lỗi.
      placeholder: |
        Phím đã gõ: tieengs vieetj
        Kết quả thực tế:
        Kết quả mong đợi: tiếng việt
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: App gặp lỗi
      description: Ghi tên app và cách cài (Flatpak, Snap, gói của distro, AppImage). Nếu là trang web, ghi trình duyệt và trang web.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Chế độ gõ
      options:
        - Gõ Sen
        - Gạch chân (Preedit)
        - Chọn Emoji
        - Không rõ
    validations:
      required: true

  - type: input
    id: input_type
    attributes:
      label: Kiểu gõ
      placeholder: Telex, VNI, VIQR, ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Lỗi xảy ra bao lâu một lần?
      options:
        - Lần nào cũng bị
        - Thỉnh thoảng
        - Mới bị một lần

  - type: textarea
    id: typing_log
    attributes:
      label: Nhật ký gõ
      description: |
        Đây là thông tin hữu ích nhất khi Ngó Sen gõ sai chữ. Gõ một câu test; ngay sau khi lỗi xảy ra, chọn "Lưu nhật ký gõ" trong menu Ngó Sen ở khay hệ thống.
        File `~/.local/state/ngosen/typing-<date>-<time>.log` lưu vài trăm phím gần nhất, những gì Ngó Sen gửi cho app và app báo lại.
        File chứa nội dung vừa gõ (không ghi nội dung trong ô mật khẩu). Đọc file trước khi chia sẻ, rồi kéo file vào ô này.

  - type: textarea
    id: diagnose
    attributes:
      label: Kết quả "Kiểm tra máy tôi"
      description: Kết quả từ "Cài đặt Ngó Sen" → "Giới thiệu" → "Kiểm tra máy tôi…". Nếu chưa được điền sẵn, chọn "Chép kết quả" rồi dán vào đây.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version Ngó Sen
      placeholder: 1.6.1-1
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distro
      description: Ghi tên và version distro.
    validations:
      required: true

  - type: dropdown
    id: desktop_env
    attributes:
      label: Desktop
      options:
        - KDE Plasma
        - GNOME
        - Cinnamon
        - Xfce
        - COSMIC
        - Hyprland
        - Sway
        - i3
        - Khác

  - type: dropdown
    id: session
    attributes:
      label: Session
      options:
        - Wayland
        - X11
        - Không rõ
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Cách cài Ngó Sen
      options:
        - Lệnh cài một dòng (install.sh)
        - Repo của distro (dnf, apt, pacman, zypper)
        - Gói tải từ trang Releases
        - nixpkgs
        - Tự build từ source
        - Khác

  - type: textarea
    id: log_fcitx5
    attributes:
      label: Log fcitx5 hoặc backtrace
      description: |
        Khi fcitx5 treo, crash hoặc menu ở khay hệ thống không phản hồi, chạy trong terminal:
        ```sh
        fcitx5 -r --verbose ngosen=4 2>&1 | tee ~/ngosen-fcitx5.log
        ```
        Làm lại các bước gây lỗi, nhấn Ctrl+C, rồi chạy `fcitx5 -rd` để dùng lại bình thường. Dán log hoặc đính kèm file `~/ngosen-fcitx5.log`.
        Trên KDE Plasma Wayland, fcitx5 chạy từ terminal không gõ được trong app Qt; nếu dùng môi trường này, ghi rõ trong báo cáo.
        Nếu fcitx5 đang treo, mở terminal khác và chạy lệnh sau (cần gdb), rồi đính kèm file `~/fcitx5-bt.txt`:
        ```sh
        gdb -p $(pgrep -x fcitx5) -batch -ex "thread apply all bt" > ~/fcitx5-bt.txt 2>&1
        ```

  - type: textarea
    id: additional
    attributes:
      label: Thông tin thêm
      description: Ảnh chụp màn hình, video hoặc version cũ từng dùng không gặp lỗi.
