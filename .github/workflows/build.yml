name: CI
on:
  # Pull request branches run through pull_request only; a push run would test the same commit twice.
  push:
    branches: [main, next, patch]
    tags: ['*']
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || (github.head_ref || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v7
      - uses: fcitx/github-actions@clang-format

  new-names:
    name: Check new names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Self-test
        run: misc/check-new-names.sh --self-test
      - name: No lotus in new names
        run: misc/check-new-names.sh origin/main

  check:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    container: archlinux:latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel clang cmake ninja extra-cmake-modules fmt libuv boost git systemd-libs extra-cmake-modules python librsvg rust
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/ngosen"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5"
      # fcitx5 changes far less often than this repository; rebuild it only for a new fcitx5 commit,
      # compiler or library it links.
      - name: Find fcitx5 revision
        id: fcitx5
        run: |
          echo "sha=$(git ls-remote https://github.com/fcitx/fcitx5 HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "deps=$(pacman -Q fmt libuv gcc-libs ${{ matrix.compiler }} | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore fcitx5 build
        id: fcitx5-cache
        uses: actions/cache/restore@v6
        with:
          path: /opt/fcitx
          key: fcitx5-${{ matrix.compiler }}-${{ steps.fcitx5.outputs.sha }}-${{ steps.fcitx5.outputs.deps }}
      - uses: actions/checkout@v7
        if: steps.fcitx5-cache.outputs.cache-hit != 'true'
        with:
          repository: fcitx/fcitx5
          ref: ${{ steps.fcitx5.outputs.sha }}
          path: fcitx5
      - name: Cache fcitx5 data files
        if: steps.fcitx5-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: 'fcitx5/**/*.tar.*'
          key:
            ${{ runner.os }}-${{ hashFiles('fcitx5/src/modules/spell/CMakeLists.txt')
            }}
      - name: Build and Install fcitx5
        if: steps.fcitx5-cache.outputs.cache-hit != 'true'
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5
          cmake-option: >-
            -DENABLE_KEYBOARD=Off -DENABLE_X11=Off -DENABLE_WAYLAND=Off -DENABLE_ENCHANT=Off
            -DENABLE_DBUS=Off -DENABLE_SERVER=Off -DUSE_SYSTEMD=Off -DENABLE_EMOJI=On
      # Saved now: Ngó Sen installs into the same prefix later in this job.
      - name: Save fcitx5 build
        if: steps.fcitx5-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /opt/fcitx
          key: ${{ steps.fcitx5-cache.outputs.cache-primary-key }}
      - uses: actions/checkout@v7
        with:
          path: ngosen
      # Scanned on pushes to the branches instead of every pull request; the scan doubles this job's time.
      - name: Init CodeQL
        if: matrix.compiler == 'gcc' && github.event_name != 'pull_request'
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: cpp
          source-root: ngosen
      - name: Build and Install Ngó Sen
        uses: fcitx/github-actions@cmake
        with:
          path: ngosen
          cmake-option: >-
            -DBUILD_TESTING=ON
      - name: Discover tests
        run: |
          ctest --test-dir ngosen/build -N
      - name: Test
        run: |
          ctest --test-dir ngosen/build --output-on-failure --no-tests=error -j"$(nproc)"
      - name: CodeQL Analysis
        if: matrix.compiler == 'gcc' && github.event_name != 'pull_request'
        uses: github/codeql-action/analyze@v4.38.1
        with:
          checkout_path: ngosen

  # The typing logic must build and pass its tests with no fcitx5 installed. Ubuntu 24.04 is the
  # oldest Ubuntu we package for, so this also keeps it building with its GCC 13.
  core-only:
    name: Typing logic without fcitx5
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates g++ cmake make cargo-1.91 rustc-1.91 git
      - uses: actions/checkout@v7
      - name: No fcitx5 package
        run: "! dpkg -l | grep -i fcitx"
      - name: Build
        run: |
          export PATH="/usr/lib/rust-1.91/bin:$PATH"
          cmake -S . -B build -DNGOSEN_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j"$(nproc)"

  # Builds this checkout, so a change that breaks the NixOS package fails here.
  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build, test and load into fcitx5
        run: nix flake check -L

  rust-check:
    name: Rust core lint and minimum version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bamboo-rs
    steps:
      - uses: actions/checkout@v7
      - name: rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --offline --locked --all-targets -- -D warnings
      - name: Test with the minimum Rust
        run: |
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 test --offline --locked

  # The packages prefer Qt6 but still accept PyQt5, so the window must run on both.
  settings-gui:
    name: Settings window tests (${{ matrix.qt }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: Qt5
            image: ubuntu:24.04
            packages: python3-pyqt5
            api: pyqt5
          - qt: Qt6
            image: ubuntu:24.04
            packages: python3-pyqt6 qt6-qpa-plugins
            api: pyqt6
    env:
      QT_API: ${{ matrix.api }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-qtpy python3-dbus python3-gi dbus fonts-dejavu-core ${{ matrix.packages }}
      - uses: actions/checkout@v7
      - name: Test
        working-directory: settings-gui/tests
        run: python3 -m unittest discover -v

  # Ubuntu 24.04 has the oldest libadwaita the GTK window supports, Arch the newest.
  settings-gtk:
    name: Settings window tests (GTK, ${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libadwaita 1.5
            image: ubuntu:24.04
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              --no-install-recommends python3 python3-gi python3-dbus gir1.2-gtk-4.0 gir1.2-adw-1
              xvfb xauth fonts-dejavu-core
          - name: newest libadwaita
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm python python-gobject python-dbus gtk4 libadwaita
              xorg-server-xvfb xorg-xauth ttf-dejavu
    env:
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      NGOSEN_WINDOW_TESTS: required
    steps:
      - name: Install dependencies
        run: ${{ matrix.install }}
      - uses: actions/checkout@v7
      - name: Test
        working-directory: settings-gui/tests
        run: xvfb-run -a python3 -m unittest -v test_gtk_window test_launcher test_core_toolkit_free

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Ruff Lint and Format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'check settings-gui'
      - name: Run Ruff Format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'format --check settings-gui'
