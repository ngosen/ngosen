name: CI
on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || (github.head_ref || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v7
      - uses: fcitx/github-actions@clang-format

  new-names:
    name: Check new names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Self-test
        run: misc/check-new-names.sh --self-test
      - name: No lotus in new names
        run: misc/check-new-names.sh origin/main

  check:
    # The Go builds keep the names that branch protection requires.
    name: Build and test (${{ matrix.compiler }}${{ matrix.core == 'rust' && ', rust core' || '' }})
    runs-on: ubuntu-latest
    container: archlinux:latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        core: [go]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
          - compiler: gcc
            cxx_compiler: g++
            core: rust
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel clang cmake ninja extra-cmake-modules fmt libuv boost git go systemd-libs extra-cmake-modules python librsvg rust
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5-lotus"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/fcitx5"
      - uses: actions/checkout@v7
        with:
          repository: fcitx/fcitx5
          path: fcitx5
      - name: Cache fcitx5 data files
        uses: actions/cache@v6
        with:
          path: 'fcitx5/**/*.tar.*'
          key:
            ${{ runner.os }}-${{ hashFiles('fcitx5/src/modules/spell/CMakeLists.txt')
            }}
      - name: Build and Install fcitx5
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5
          cmake-option: >-
            -DENABLE_KEYBOARD=Off -DENABLE_X11=Off -DENABLE_WAYLAND=Off -DENABLE_ENCHANT=Off
            -DENABLE_DBUS=Off -DENABLE_SERVER=Off -DUSE_SYSTEMD=Off -DENABLE_EMOJI=On
      - uses: actions/checkout@v7
        with:
          path: fcitx5-lotus
          submodules: true
      - name: Init CodeQL
        if: matrix.compiler == 'gcc' && matrix.core == 'go'
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: cpp,go
          source-root: fcitx5-lotus
      - name: Build and Install fcitx5-lotus
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5-lotus
          cmake-option: >-
            -DBUILD_TESTING=ON ${{ matrix.core == 'rust' && '-DNGOSEN_RUST_CORE=ON' || '' }}
      - name: Discover tests
        run: |
          ctest --test-dir fcitx5-lotus/build -N
      - name: Test
        run: |
          ctest --test-dir fcitx5-lotus/build --output-on-failure --no-tests=error
      - name: CodeQL Analysis
        if: matrix.compiler == 'gcc' && matrix.core == 'go'
        uses: github/codeql-action/analyze@v4.38.1
        with:
          checkout_path: fcitx5-lotus

  # The typing logic must build and pass its tests with no fcitx5 installed. Ubuntu 22.04 is the
  # oldest system we package for, so this also keeps it building as C++17 with GCC 11.
  core-only:
    name: Typing logic without fcitx5
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates g++ cmake make golang-go git
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: No fcitx5 package
        run: "! dpkg -l | grep -i fcitx"
      - name: Build
        run: |
          cmake -S . -B build -DNGOSEN_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # Builds this checkout, so a change that breaks the NixOS package fails here.
  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build, test and load into fcitx5
        run: nix flake check -L

  go-test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.18'
      - name: Test
        working-directory: bamboo
        run: go test -race ./...
      - name: Vet
        working-directory: bamboo
        run: go vet ./...
      - name: gofmt
        working-directory: bamboo
        run: |
          test -z "$(gofmt -l *_test.go)"

  rust-check:
    name: Rust core lint and minimum version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bamboo-rs
    steps:
      - uses: actions/checkout@v7
      - name: rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --offline --locked --all-targets -- -D warnings
      - name: Test with the minimum Rust
        run: |
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 test --offline --locked

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Ruff Lint and Format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'check settings-gui'
      - name: Run Ruff Format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'format --check settings-gui'
