name: Test Packaging Build

on:
  push:
    # Tags and next are built by the release and next pre-release workflows, which call this one;
    # pull request branches run through pull_request only.
    branches: [main, patch]
  pull_request:
  workflow_call:
    inputs:
      # Packages for testers: every target, with a version that a release later upgrades.
      test-build:
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || (github.head_ref || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # A pull request that changes no packaging or build files builds one package per family. Pushes,
  # releases and pull requests that do touch them build every target in .github/package-matrix.json.
  scope:
    name: Package targets
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      deb: ${{ steps.scope.outputs.deb }}
      fedora: ${{ steps.scope.outputs.fedora }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TEST_BUILD: ${{ inputs.test-build }}
        run: |
          full=true
          # A failed diff leaves the full set.
          if [ "$EVENT" = pull_request ] && [ "$TEST_BUILD" != true ] && changed=$(git diff --name-only "$BASE" HEAD) &&
              ! printf '%s\n' "$changed" |
              grep -qE '^(packaging/|install\.sh$|test/install-smoke\.sh$|\.github/|cmake/|bamboo|settings-gui/|pyproject\.toml$)|CMakeLists\.txt$'; then
              full=false
          fi
          filter='if $full then . else map(select(.pr)) end'
          {
              echo "full=$full"
              echo "deb=$(jq -c --argjson full "$full" ".deb | $filter" .github/package-matrix.json)"
              echo "fedora=$(jq -c --argjson full "$full" ".fedora | $filter" .github/package-matrix.json)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build-deb:
    name: DEB [${{ matrix.codename }}${{ matrix.arch == 'arm64' && ', arm64' || '' }}]
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.deb) }}

    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7

      - name: Put the commit in a test build's version
        if: (github.event_name == 'push' && github.ref == 'refs/heads/next') || inputs.test-build
        run: packaging/stamp-next-version.sh

      - name: Prepare debian directory
        run: cp -r packaging/debian debian

      - name: Build DEB
        uses: jtdor/build-deb-action@473136f14a42a231124c1f7cefaedfe941203c38 # v1.9.1
        with:
          docker-image: ${{ matrix.distro }}
          buildpackage-opts: >-
            --build=binary --no-sign

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.codename }}${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: debian/artifacts/*.deb
          retention-days: 3

  build-rpm-fedora:
    name: RPM [fedora-${{ matrix.releasever }}${{ matrix.arch == 'arm64' && ', arm64' || '' }}]
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.fedora) }}

    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7

      - name: Put the commit in a test build's version
        if: (github.event_name == 'push' && github.ref == 'refs/heads/next') || inputs.test-build
        run: packaging/stamp-next-version.sh

      - name: Build Fedora RPM
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: ${{ matrix.distro }}
          options: -v ${{ github.workspace }}:/work
          run: |
            set -euo pipefail
            find / -name '*openh264*' -type f -delete 2>/dev/null || true
            dnf clean all
            dnf install -y rpm-build rpmdevtools dnf-plugins-core
            rpmdev-setuptree
            cp /work/packaging/rpm/fedora/fcitx5-ngosen.spec ~/rpmbuild/SPECS/
            dnf builddep --setopt=install_weak_deps=False -y ~/rpmbuild/SPECS/fcitx5-ngosen.spec
            mkdir -p ~/rpmbuild/SOURCES
            cd /work
            VERSION=$(grep '^Version:' packaging/rpm/fedora/fcitx5-ngosen.spec | awk '{print $2}')
            tar --exclude='.git' \
                --exclude='packaging' \
                --transform "s|^\.|fcitx5-ngosen-${VERSION}|" \
                -czf ~/rpmbuild/SOURCES/fcitx5-ngosen-${VERSION}.tar.gz .
            rpmbuild -bb ~/rpmbuild/SPECS/fcitx5-ngosen.spec
            mkdir -p /work/output
            find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} /work/output/ \;

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-fedora-${{ matrix.releasever }}${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: output/*.rpm
          retention-days: 3

  build-rpm-opensuse:
    name: RPM [opensuse-${{ matrix.releasever }}]
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: opensuse/tumbleweed
            releasever: tumbleweed

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Put the commit in a test build's version
        if: (github.event_name == 'push' && github.ref == 'refs/heads/next') || inputs.test-build
        run: packaging/stamp-next-version.sh

      - name: Build openSUSE RPM
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: ${{ matrix.distro }}
          options: -v ${{ github.workspace }}:/work
          run: |
            set -euo pipefail
            zypper -n dup
            zypper install -y rpm-build rpmdevtools
            rpmdev-setuptree
            cp /work/packaging/rpm/opensuse/fcitx5-ngosen.spec ~/rpmbuild/SPECS/
            zypper -n install \
              $(rpmspec -P ~/rpmbuild/SPECS/fcitx5-ngosen.spec \
                | grep '^BuildRequires:' \
                | awk '{print $2}' \
                | xargs)
            mkdir -p ~/rpmbuild/SOURCES
            cd /work
            VERSION=$(grep '^Version:' packaging/rpm/opensuse/fcitx5-ngosen.spec | awk '{print $2}')
            tar --exclude='.git' \
                --exclude='packaging' \
                --transform "s|^\.|fcitx5-ngosen-${VERSION}|" \
                -czf ~/rpmbuild/SOURCES/fcitx5-ngosen-${VERSION}.tar.gz .
            rpmbuild -bb ~/rpmbuild/SPECS/fcitx5-ngosen.spec
            mkdir -p /work/output
            find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} /work/output/ \;

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-opensuse-${{ matrix.releasever }}
          path: output/*.rpm
          retention-days: 3
  build-arch:
    name: Arch Linux (pacman)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Put the commit in a test build's version
        if: (github.event_name == 'push' && github.ref == 'refs/heads/next') || inputs.test-build
        run: packaging/stamp-next-version.sh

      - name: Build Arch package
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: archlinux:latest
          options: -v ${{ github.workspace }}:/work
          run: |
            set -euo pipefail
            pacman -Syu --noconfirm --needed base-devel
            # makepkg refuses to run as root.
            useradd -m builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
            cp -r /work /home/builder/src
            chown -R builder /home/builder/src
            cd /home/builder/src/packaging/arch
            sudo -u builder makepkg -s --noconfirm
            mkdir -p /work/output
            # makepkg names it fcitx5-ngosen-1:0.5.0-1-…; artifact and release asset names may not
            # contain a colon. pacman reads the epoch from inside the package.
            for pkg in ./*.pkg.tar.zst; do
                cp "$pkg" "/work/output/$(basename "$pkg" | sed 's/^fcitx5-ngosen-[0-9]*:/fcitx5-ngosen-/')"
            done

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-pkg
          path: output/*.pkg.tar.zst
          retention-days: 3

  # Runs install.sh on this run's packages, laid out as in a release, so the test covers this
  # change rather than the last published build.
  install-test:
    name: Installer [${{ matrix.name }}]
    # Needs every published package, so it runs only when they are all built.
    needs: [scope, build-deb, build-rpm-fedora, build-rpm-opensuse, build-arch]
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-13, X11, no recommends
            image: debian:13
            args: --no-recommends x11
          - name: kali-rolling, X11
            image: kalilinux/kali-rolling
            args: x11
          - name: ubuntu-24.04, X11
            image: ubuntu:24.04
            args: x11
          - name: ubuntu-24.04, X11, arm64
            image: ubuntu:24.04
            args: x11
            arch: arm64
          - name: ubuntu-26.04, GNOME
            image: ubuntu:26.04
            args: gnome
          - name: fedora-44, GNOME
            image: fedora:44
            args: gnome
          - name: fedora-44, KDE
            image: fedora:44
            args: kde

    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Without an init, fcitx5 daemons that exit stay as zombies, and the installer takes them for a
    # running fcitx5 and starts a new one.
    container:
      image: ${{ matrix.image }}
      options: --init

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Collect release files
        run: packaging/collect-release-files.sh artifacts dist

      - name: Install, uninstall and reinstall
        run: test/install-smoke.sh ${{ matrix.args }} dist
