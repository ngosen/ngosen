<!doctype html>
<html><head><meta charset="utf-8"><title>univer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-core@0.10.14/lib/index.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@univerjs/presets@0.10.14/lib/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-core@0.10.14/lib/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@univerjs/preset-sheets-core@0.10.14/lib/umd/locales/en-US.js"></script>
</head>
<body style="margin:0">
<div id="s" style="position:absolute;inset:0"></div>
<script src="report.js"></script>
<script>window.arrowsCommit = true;</script>
<script>
  // Univer draws on a canvas and edits in its own document editor, like Google Sheets.
  const { createUniver } = UniverPresets;
  const { LocaleType, mergeLocales } = UniverCore;
  const { UniverSheetsCorePreset } = UniverPresetSheetsCore;
  const { univerAPI } = createUniver({
    locale: LocaleType.EN_US,
    locales: { [LocaleType.EN_US]: mergeLocales(UniverPresetSheetsCoreEnUS) },
    presets: [UniverSheetsCorePreset({ container: 's', header: false, footer: false })],
  });
  univerAPI.createWorkbook({});
  function sheet() {
    const wb = univerAPI.getActiveWorkbook();
    return wb && wb.getActiveSheet();
  }
  function cells() {
    const s = sheet();
    return s ? s.getRange(0, 0, 12, 5).getValues() : null;
  }
  function center(r, c) {
    const rect = sheet().getRange(r, c).getCellRect();
    return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  }
  report('univer', cells, center);
</script>
</body></html>
